:root {

body { margin: 0; text-align: center; }
main { max-width: 68rem; margin: 0 auto; padding: clamp(2rem, 7vw, 5rem) 1rem 2rem; }

.modes { margin-bottom: 1.75rem; }
.modes label { display: inline-block; position: relative; }
.modes input { opacity: 0; position: absolute; }

.pool p { margin: -.2rem 0 .9rem; font-size: .9rem; }
.spells { flex-wrap: wrap; gap: .25rem; }
.spells button { border: 1px solid transparent; background: #fff; color: #212529; padding: .45rem; border-radius: .3rem; }

.spells img { display: block; margin: 0 auto .3rem; border-radius: .2rem; }
.spells span { font-size: .78rem; }
.spells button[aria-pressed="false"] img { filter: grayscale(1); opacity: .45; }
.spells button:disabled { cursor: default; color: #5f6268; }
footer { padding: 0 1rem 2rem; display: grid; justify-items: center; gap: .4rem; font-size: .8rem; color: #535d67; }

<script>
// Static restoration of Colby Baker's 2021 generator. The map and spell pool
// follow the original release, including availability of Mark on ARAM.
const spellButtons = Array.from(document.querySelectorAll("[data-spell]"));
const outputs = [document.getElementById("spell-1"), document.getElementById("spell-2")];
const status = document.getElementById("status");
const mark = spellButtons.find(button => button.dataset.spell === "Mark");

function toggleSpell(button) {
  const active = button.getAttribute("aria-pressed") === "true";
  button.setAttribute("aria-pressed", String(!active));
  status.textContent = "";
}

function randomizeSpells() {
  const pool = spellButtons.filter(button => button.getAttribute("aria-pressed") === "true");
  if (pool.length < 2) {
    status.textContent = "Pick two or more spells.";
    return;
  }

  // Draw without replacement so every ordered pair has equal probability.
  for (const output of outputs) {
    const index = Math.floor(Math.random() * pool.length);
    const choice = pool.splice(index, 1)[0];
    output.src = choice.querySelector("img").src;
    output.nextElementSibling.textContent = choice.dataset.spell;
  }
  status.textContent = "";
}

for (const button of spellButtons) {
  button.addEventListener("click", () => toggleSpell(button));
}

document.getElementById("toggle-all").addEventListener("click", () => {
  for (const button of spellButtons) {
    if (!button.disabled) toggleSpell(button);
  }
});

for (const input of document.querySelectorAll("input[name=mode]")) {
  input.addEventListener("change", () => {
    const aram = input.value === "ARAM";
    mark.disabled = !aram;
    mark.setAttribute("aria-pressed", String(aram));
    status.textContent = "";
  });
}

document.getElementById("randomize").addEventListener("click", randomizeSpells);
randomizeSpells();

</script>
